# Render Blueprint — infrastructure as code for this repository.
#
# IMAGE STORAGE (Render FREE plan compatible)
# -------------------------------------------
# Uploaded images are stored on **Cloudinary**, and the database holds the
# permanent absolute HTTPS URL that Cloudinary returns. Nothing is written to the
# container filesystem for durable storage, so:
#   - No Persistent Disk is used or required.
#   - No paid Render plan is required (this service runs on `plan: free`).
#   - Images survive restarts, redeploys, and container replacement.
#
# This replaced an earlier Persistent-Disk approach, which is not available on
# Render's Free plan.
#
# DEPLOYMENT NOTE
# ---------------
# The project runs as a SINGLE Render Web Service: `dist/server.cjs` serves the
# built SPA from `dist/` AND the `/api/*` routes (see README "Option A").
#
# Secrets are NOT stored in this file. Add their values in the Render dashboard
# (each is declared below with `sync: false`).

services:
  - type: web
    name: principal-portfolio
    runtime: node
    region: oregon
    plan: free
    branch: main
    # Node 22 per .node-version / package.json engines.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; do not hardcode it.
      # Persistent image storage on Cloudinary (required in production). The
      # server fails fast at boot if these are missing in production, because the
      # local filesystem is ephemeral. Set the values in the Render dashboard.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: Cloudinary folder name for uploaded assets.
      - key: CLOUDINARY_FOLDER
        value: principal-portfolio
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Only needed for a split (Static Site + Web Service) deploy.
      - key: CORS_ORIGINS
        sync: false
