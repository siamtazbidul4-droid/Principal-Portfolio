# Render Blueprint — infrastructure as code for this repository.
#
# WHY THIS FILE EXISTS
# --------------------
# Uploaded images are written to disk by the Express backend (`/api/upload`) and
# served back from `/uploads/*`. On a container host such as Render the default
# containers filesystem is EPHEMERAL: files survive while the instance is running
# but are discarded on every restart/redeploy. That is what made images display
# immediately after upload and then break after a refresh/redeploy.
#
# The fix is a Render Persistent Disk mounted into the service, plus
# `UPLOADS_DIR` pointing at a directory inside that mount. The application code
# already reads `UPLOADS_DIR` for BOTH writing and static serving
# (`backend/src/config/uploads.ts`, used by `upload.routes.ts` and `app.ts`), so
# no code path changes — only the deployment declares durable storage here.
#
# DEPLOYMENT NOTE
# ---------------
# This project runs as a SINGLE Render Web Service: `dist/server.cjs` serves the
# built SPA from `dist/` AND the `/api/*` routes (see README "Option A").
#
# If you created the service manually in the Render dashboard (rather than from
# this Blueprint), Render will NOT retroactively apply the disk below. In that
# case either (a) delete and recreate the service from this Blueprint, or
# (b) attach the disk + env var by hand in the dashboard — the values to use are
# exactly the ones declared here. Behavior is identical either way.

services:
  - type: web
    name: principal-portfolio
    runtime: node
    region: oregon
    plan: starter
    branch: main
    # Node 22 per .node-version / package.json engines.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; do not hardcode it.
      # Persistent upload storage: files live on the mounted disk below, and the
      # app reads this path for uploads + static serving.
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Secrets are set in the Render dashboard (sync: false) and are NOT stored
      # here. Populate each of these on the service before the first deploy.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Only needed for a split (Static Site + Web Service) deploy.
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
